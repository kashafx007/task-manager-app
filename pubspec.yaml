name: tasknest
description: >-
  TaskNest - a cute task manager built with Flutter. SQLite storage, repeat
  tasks, subtasks with progress, CSV/PDF/email export, light and dark themes,
  custom notification sounds, and reminders that work on Chrome and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- Database (SQLite on Android, SQLite-WASM in the browser) ---
  sqflite: ^2.4.1
  sqflite_common: ^2.5.4
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0

  # --- Settings ---
  shared_preferences: ^2.3.0

  # --- Notifications and sound ---
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  audioplayers: ^6.1.0

  # --- Export (CSV / PDF / email) ---
  pdf: ^3.11.0
  share_plus: ^10.1.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0

  # --- Browser APIs (Chrome notifications, file download) ---
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
dependency_overrides:
  image: 4.5.4
  archive: 4.0.7